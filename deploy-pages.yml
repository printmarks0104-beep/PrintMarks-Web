# PrintMarks public web portal

This folder is a static customer/shop portal backed by Supabase Auth, Database,
Storage and RLS.

For local testing, copy `config.template.js` to `config.js`, enter the project URL
and `sb_publishable_` key, then run:

```bat
py -m http.server 8080
```

Open `http://localhost:8080`.

For GitHub Pages, use the supplied workflow and repository variables. Never put
`sb_secret_`, `service_role`, payment secrets or signing certificates in this
folder. The Supabase publishable key is designed for public clients; RLS must be
enabled and tested.
